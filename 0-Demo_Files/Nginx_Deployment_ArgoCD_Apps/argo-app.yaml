apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: new-app
  namespace: argocd
spec:
  destination:
    namespace: new-app
    server: https://kubernetes.default.svc
  source:
    path: 0-Demo_Files/Demo_Deployment
    repoURL: https://github.com/jehadkalifah/ArgoCD-Complete-Master-Course.git
    targetRevision: HEAD
  sources: []
  project: my-project
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
